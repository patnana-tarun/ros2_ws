# Parameters for explorer_relay_node. Defaults match the values hard-coded in the node.
explorer_relay_node:
  ros__parameters:
    # The latest /map is published on the mesh every this many seconds.
    map_publish_period_sec: 3.0
    # 1 of every tf_decimation /tf messages (per tf source) is forwarded.
    tf_decimation: 3
