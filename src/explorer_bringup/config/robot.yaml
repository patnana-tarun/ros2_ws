# Real-robot parameters (Raspberry Pi). See esp32_bridge.py / x2_lidar.py.
# Pins, encoder resolution and the speed-loop gains live on the ESP32:
# firmware/explorer_esp32/config.h.
esp32_bridge:
  ros__parameters:
    baud: 115200
    wheel_radius: 0.0325       # for the wheel angles on /joint_states
    track_width: 0.43          # EFFECTIVE skid-steer track (sim-calibrated); recalibrate
    cmd_timeout: 0.5           # stop if /cmd_vel is silent this long (s)
    cmd_rate: 20.0             # S commands to the ESP32 (Hz)
    slip_ratio: 0.3            # front/rear disagreement that marks a side as slipping
    imu_frame: imu_link
    gyro_variance: 4.0e-6      # (0.002 rad/s)^2, ICM-20948 at a ~51 Hz DLPF
    accel_variance: 3.0e-4     # (0.017 m/s^2)^2

x2_lidar:
  ros__parameters:
    baud: 115200
    frame_id: laser_frame
    beams: 360                 # 1 deg bins; the X2 gives ~430 points per turn at 7 Hz
    range_min: 0.12
    range_max: 8.0
    inverted: true             # X2 turns clockwise; ROS angles are counter-clockwise
    angle_offset_deg: 0.0      # set so an object in front of the robot shows at 0 deg
    motor_dtr: true            # flip if the motor does not spin
